# Facts about this chat platform that the generic scripts read. Plain KEY="value".
CHAT_SUPPORTED="true"
CHAT_LABEL="Telegram"
# Claude Code channel plugin (must come from the claude-plugins-official marketplace)
CHAT_PLUGIN="telegram@claude-plugins-official"
# per-area plugin state (bot token + access list) lives in ~/.claude/channels/<prefix><area>/
CHAT_STATE_PREFIX="telegram-"
# env var the plugin reads to find that directory
CHAT_STATE_ENV="TELEGRAM_STATE_DIR"
# file inside it that holds the bot token, and the key name
CHAT_TOKEN_FILE=".env"
CHAT_TOKEN_KEY="TELEGRAM_BOT_TOKEN"
# a process-name pattern that proves the plugin's bot is running (used by the Ops bot)
CHAT_PROCESS_PATTERN="bun.*telegram"
